parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Service\PipelineCreateService:
        factory: ['App\Service\PipelineCreateService', 'create']
        arguments:
            - '%kernel.project_dir%'
            - '@doctrine.orm.entity_manager'
