###############################################################################
#                          Generated on phpdocker.io                          #
###############################################################################
services:
    postgres:
        container_name: async-pipeline-postgres
        restart: unless-stopped
        image: 'postgres:15-alpine'
        working_dir: /application
        volumes:
            - '.:/application'
            - async-pipeline-pgdata:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=async_pipeline_user
            - POSTGRES_PASSWORD=async_pipeline_pass
            - POSTGRES_DB=async_pipeline_db

    pgbouncer:
        container_name: async-pipeline-db
        depends_on:
            - postgres
        restart: unless-stopped
        image: edoburu/pgbouncer:latest
        environment:
            DB_USER: async_pipeline_user
            DB_PASSWORD: async_pipeline_pass
            DB_HOST: async-pipeline-postgres
            DATABASES: |
                async_pipeline_db = host=async-pipeline-postgres dbname=async_pipeline_db
                async_pipeline_db_test = host=async-pipeline-postgres dbname=async_pipeline_db_test
            POOL_MODE: transaction
            MAX_CLIENT_CONN: 100
            DEFAULT_POOL_SIZE: 20
            LISTEN_PORT: 5435
        volumes:
            - ./containers/db/pgbouncer_userlist.txt:/etc/pgbouncer/userlist.txt:ro

    webserver:
        container_name: async-pipeline-webserver
        restart: unless-stopped
        image: 'nginx:alpine'
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '20044:80'

    php-fpm:
        container_name: async-pipeline-php-fpm
        restart: unless-stopped
        build: phpdocker/php-fpm
        working_dir: /application
        volumes:
            - '.:/application'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.5/fpm/conf.d/99-overrides.ini'
            - './phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.5/cli/conf.d/99-overrides.ini'
            - ./var/logs/php-fpm:/var/log

    graph-editor-client:
        container_name: async-pipeline-graph-editor-client
        restart: unless-stopped
        image: 'node:lts-alpine'
        working_dir: /app/client
        volumes:
            - './graph-editor:/app'
        ports:
            - '20045:5174'
        command: sh -c "npm install && npm run build && npm run dev -- --host"

    graph-editor-server:
        container_name: async-pipeline-graph-editor-server
        restart: unless-stopped
        image: 'node:lts-alpine'
        working_dir: /app
        volumes:
            - './graph-editor:/app'
            - './config/pipelines:/pipelines'
            - './src:/php-src'
        ports:
            - '20046:4001'
        environment:
            - PHP_API_URL=http://webserver
        command: sh -c "npm install && node server.js"

volumes:
    async-pipeline-pgdata:
